  <h2>What is Integration?</h2>
  <p>
    Integration is the reverse of differentiation. It is used to find the original function.
  </p>

  <h3>Basic Rule</h3>
  <div class="example">
    ∫ x² dx = (x³ / 3) + C
  </div>

  <h3>Example</h3>
  <div class="example">
    ∫ 6x dx  
    <br><br>
    = 3x² + C
  </div>
