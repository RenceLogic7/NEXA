<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NEXA | Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/register.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <h1>NEXA</h1>
  <p>Create Your Account</p>

  <div class="top-buttons">
    <button class="btn" onclick="goTo('index.html')">
      Home
    </button>
  </div>

</header>

<!-- =========================
     REGISTER FORM
========================= -->

<div class="container">

  <div class="auth-card">

    <h2>Create Account</h2>

    <p class="auth-text">
      Join thousands of learners mastering mathematics with NEXA.
    </p>

    <form id="registerForm">

      <!-- First Name -->

      <div class="form-group">

        <label for="firstName">
          First Name
        </label>

        <input
          type="text"
          id="firstName"
          name="firstName"
          placeholder="Enter your first name"
          required
        >

      </div>

      <!-- Last Name -->

      <div class="form-group">

        <label for="lastName">
          Last Name
        </label>

        <input
          type="text"
          id="lastName"
          name="lastName"
          placeholder="Enter your last name"
          required
        >

      </div>

      <!-- Email -->

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <!-- Phone -->

      <div class="form-group">

        <label for="phone">
          Phone Number (Optional)
        </label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="Enter your phone number"
        >

      </div>

      <!-- Password -->

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Create a password"
          required
        >

      </div>

      <!-- Confirm Password -->

      <div class="form-group">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm your password"
          required
        >

      </div>

      <!-- Terms -->

      <div class="checkbox-row">

        <label>

          <input
            type="checkbox"
            id="terms"
            required
          >

          I agree to the Terms of Service and Privacy Policy.

        </label>

      </div>

      <!-- Register Button -->

      <button
        type="submit"
        class="cta-btn"
      >
        Create Account
      </button>

    </form>

    <div class="divider"></div>

    <p class="bottom-text">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </p>

  </div>

</div>

<!-- =========================
     FOOTER
========================= -->

<footer>

  Developed by Adeoye Adewusi | adeoyeadewusi2020@gmail.com

</footer>

<!-- =========================
     SCRIPTS
========================= -->

<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
