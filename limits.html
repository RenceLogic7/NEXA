<div class="lesson-container">

  <h2>What is a Limit?</h2>
  <p>
    A limit describes the value that a function approaches as the input gets closer to a certain number.
  </p>

  <h3>Example</h3>
  <div class="example">
    lim (x → 2) (x²) = 4
  </div>

  <p>
    This means as x gets closer to 2, the value of x² gets closer to 4.
  </p>
