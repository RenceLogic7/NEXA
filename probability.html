  <h2>What is Probability?</h2>
  <p>
    Probability measures how likely an event is to occur.
  </p>

  <h3>Formula</h3>
  <div class="example">
    Probability = (Favourable outcomes) ÷ (Total outcomes)
  </div>

  <h3>Example</h3>
  <div class="example">
    A fair die has 6 sides.  
    Probability of rolling a 3:
    <br><br>
    = 1 ÷ 6
  </div>
