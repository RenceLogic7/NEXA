  <h1>Mode</h1>
</header>

<div class="lesson-container">

  <h2>What is the Mode?</h2>
  <p>
    The mode is the value that appears most frequently in a data set.
  </p>

  <h3>Example</h3>
  <div class="example">
    2, 4, 4, 5, 6  
    <br><br>
    Mode = 4
  </div>

  <h3>Note</h3>
  <p>
    A data set can have:
  </p>
  <ul>
    <li>No mode</li>
    <li>One mode</li>
    <li>More than one mode</li>
  </ul>
