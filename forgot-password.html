<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NEXA | Forgot Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <h1>NEXA</h1>
  <p>Password Recovery</p>

  <div class="top-buttons">
    <button class="btn" onclick="goTo('index.html')">Home</button>
  </div>

</header>

<!-- =========================
     FORGOT PASSWORD
========================= -->

<div class="container">

  <div class="auth-card">

    <h2>Forgot Password?</h2>

    <p class="auth-text">
      Enter the email address associated with your NEXA account.
      If an account exists, we'll send you a password reset link.
    </p>

    <form id="forgotPasswordForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>

      <button
        type="submit"
        class="cta-btn"
      >
        Send Reset Link
      </button>

    </form>

    <div class="divider"></div>

    <p class="bottom-text">

      Remember your password?

      <a href="login.html">
        Back to Login
      </a>

    </p>

    <p class="bottom-text">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </p>

  </div>

</div>

<!-- =========================
     FOOTER
========================= -->

<footer>

  Developed by Adeoye Adewusi | adeoyeadewusi2020@gmail.com

</footer>

<!-- =========================
     SCRIPTS
========================= -->

<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
