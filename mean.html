<div class="lesson-container">

  <h2>What is the Mean?</h2>
  <p>
    The mean is the average of a set of numbers.
  </p>

  <h3>Formula</h3>
  <div class="example">
    Mean = (Sum of values) ÷ (Number of values)
  </div>

  <h3>Example</h3>
  <div class="example">
    Find the mean of 2, 4, 6  
    <br><br>
    = (2 + 4 + 6) ÷ 3  
    <br>
    = 12 ÷ 3  
    <br>
    = 4
  </div>
