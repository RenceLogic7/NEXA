<div class="lesson-container">

  <h2>What is the Median?</h2>
  <p>
    The median is the middle value in a set of numbers arranged in order.
  </p>

  <h3>Example (Odd Count)</h3>
  <div class="example">
    1, 3, 5  
    <br><br>
    Median = 3
  </div>

  <h3>Example (Even Count)</h3>
  <div class="example">
    1, 3, 5, 7  
    <br><br>
    Median = (3 + 5) ÷ 2 = 4
  </div>
