  <h2>What is Differentiation?</h2>
  <p>
    Differentiation is the process of finding the rate of change of a function.
  </p>

  <h3>Basic Rule</h3>
  <div class="example">
    If f(x) = x²  
    <br><br>
    Then f'(x) = 2x
  </div>

  <h3>Example</h3>
  <div class="example">
    Differentiate: 3x²  
    <br><br>
    = 6x
  </div>
