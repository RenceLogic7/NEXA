  <h1>Exponents</h1>
</header>

<div class="lesson-container">

  <h2>What are Exponents?</h2>
  <p>
    Exponents represent repeated multiplication. For example, 3² means 3 × 3.
  </p>

  <h3>Examples</h3>
  <div class="example">
    2² = 2 × 2 = 4  
    <br><br>
    3³ = 3 × 3 × 3 = 27
  </div>

  <h3>In PEMDAS</h3>
  <p>
    Exponents are calculated after brackets but before multiplication and division.
  </p>

  <div class="example">
    2 + 3² = 2 + 9 = 11
  </div>
