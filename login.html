<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NEXA | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Styles -->
  <link rel="stylesheet" href="assets/css/global.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

  <h1>NEXA</h1>
  <p>Welcome Back</p>

  <div class="top-buttons">
    <button class="btn" onclick="goTo('index.html')">Home</button>
  </div>

</header>

<!-- =========================
     LOGIN FORM
========================= -->

<div class="container">

  <div class="auth-card">

    <h2>Sign In</h2>

    <p class="auth-text">
      Continue your mathematics journey.
    </p>

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        >

      </div>

      <div class="remember-row">

        <label>

          <input
            type="checkbox"
            id="rememberMe"
          >

          Remember Me

        </label>

        <a href="forgot-password.html">
          Forgot Password?
        </a>

      </div>

      <button
        type="submit"
        class="cta-btn"
      >
        Login
      </button>

    </form>

    <div class="divider"></div>

    <p class="bottom-text">

      Don't have an account?

      <a href="register.html">
        Register
      </a>

    </p>

  </div>

</div>

<!-- =========================
     FOOTER
========================= -->

<footer>

  Developed by Adeoye Adewusi | adeoyeadewusi2020@gmail.com

</footer>


<!-- =========================
     SCRIPTS
========================= -->

<script src="assets/js/main.js"></script>
<script src="assets/js/auth.js"></script>

</body>
</html>
